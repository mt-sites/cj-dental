 function toothGeo(S){
  const P=[],N=[],I=[],L=[];
  const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};

  function surf(first,rings,last,mer,ringEvery){
   const base=P.length/3,n=rings[0].length,pos=[],idx=[],ln=[];
   const push=v=>pos.push(v[0],v[1]+OY,v[2]);

function tilt(){
