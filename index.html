<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CJ Dental</title>
<style>
:root{--gold:#c9a64e;--lt:#f6e99a;--ink:#0a0a0a;--lbg:#f6f4ee;--ltx:#111;--lmut:#555;--lcard:#fff;--line:#ddd}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--lbg:#141414;--ltx:#f1f1f1;--lmut:#aaa;--lcard:#1c1c1c;--line:#333}}
:root[data-theme="dark"]{--lbg:#141414;--ltx:#f1f1f1;--lmut:#aaa;--lcard:#1c1c1c;--line:#333}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--lbg);color:var(--ltx);font-family:Inter,Segoe UI,Arial,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
#splash{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;animation:out .6s 1.8s forwards}
#splash div{width:150px;height:150px;border-radius:50%;border:3px solid #333;border-top-color:var(--gold);animation:sp 1.1s linear infinite;display:flex;align-items:center;justify-content:center}
#splash img{width:120px;border-radius:50%;animation:sp 1.1s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes out{to{opacity:0;visibility:hidden}}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;background:rgba(10,10,10,.85);backdrop-filter:blur(8px);color:#fff}
header b{letter-spacing:3px;font-size:14px;color:var(--gold)}header button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
#menu{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column;justify-content:center;padding:30px}#menu.on{display:flex}
#menu a{color:#fff;font-size:34px;font-weight:700;text-decoration:none;padding:10px 0;letter-spacing:-1px}#menu a:hover{color:var(--gold)}
.hero{min-height:100svh;color:#fff;padding:110px 22px 40px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#000c,#000e),var(--hero-img) center/cover,#000}
.eye{font-size:10px;letter-spacing:3px;color:#ccc;display:flex;align-items:center;gap:10px}.eye:before{content:"";width:28px;height:1px;background:var(--gold)}
h1{font-size:clamp(38px,11vw,72px);line-height:1;letter-spacing:-2px;margin:18px 0;max-width:760px}h1 span{font-weight:300;color:#ccc;display:block}
.hero p{color:#bbb;max-width:520px;line-height:1.6;font-size:14px}
.btns{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:30px;font:600 14px Inter,Segoe UI,Arial,sans-serif;text-decoration:none;border:1px solid #fff;cursor:pointer}
.w{background:#fff;color:#000}.o{background:transparent;color:#fff}.g{background:var(--gold);color:#000;border-color:var(--gold)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;max-width:520px;font-size:13px}.info small{display:block;color:#aaa;font-size:12px}.info b{color:#fff}
section{padding:70px 22px;max-width:900px;margin:auto}
.lab{font-size:10px;letter-spacing:3px;color:var(--lmut);display:flex;align-items:center;gap:10px;margin-bottom:14px}.lab:before{content:"";width:28px;height:1px;background:var(--gold)}
h2{font-size:clamp(32px,8vw,52px);line-height:1.05;letter-spacing:-1.5px;margin:0 0 18px}
.lead{color:var(--lmut);line-height:1.7;font-size:15px}
.num{display:flex;gap:30px;margin-top:30px;flex-wrap:wrap}.num div{font-size:54px;font-weight:800;letter-spacing:-2px;color:var(--gold)}.num small{display:block;font-size:10px;letter-spacing:3px;color:var(--lmut);font-weight:500}
.ac{border:1px solid var(--line);background:var(--lcard);border-radius:12px;margin-bottom:10px}
.ah{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:16px;padding:20px 16px;cursor:pointer}.ah i{font-size:11px;color:var(--lmut);font-style:normal}.ah b{flex:1;font-size:17px}.ah u{text-decoration:none;border:1px solid var(--line);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.ac p{display:none;margin:0;padding:0 16px 18px 48px;color:var(--lmut);font-size:14px}.ac.on p{display:block}
.dark{background:#000;color:#fff;max-width:none}.dark .in{max-width:900px;margin:auto}.dark .lead,.dark .lab{color:#aaa}
.sl{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-top:24px}.sl figure{margin:0;flex:0 0 78%;max-width:340px;scroll-snap-align:start}.sl img{width:100%;border-radius:10px;display:block}.sl figcaption{font-size:10px;letter-spacing:2px;color:#aaa;margin-top:8px}
.card{background:#000;color:#fff;border-radius:22px;padding:26px 22px}.card h3{margin:0 0 18px;font-size:24px}
.row{border-top:1px solid #333;padding:14px 0}.row small{display:block;font-size:10px;letter-spacing:2px;color:#aaa;margin-bottom:4px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:18px}.qa a,.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:14px;padding:12px 6px;font:600 12px Inter,Segoe UI,Arial,sans-serif;text-decoration:none;cursor:pointer}.qa span{font-size:22px}.qa .pri{background:#fff;color:#000}
.dock{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:#000;border-radius:30px;padding:6px;display:flex;gap:6px;max-width:520px;margin:auto;box-shadow:0 6px 20px #0008}.dock a{flex:1;text-align:center;padding:13px;border-radius:24px;font:600 14px Inter,Segoe UI,Arial,sans-serif;text-decoration:none;color:#fff}.dock a:first-child{background:#fff;color:#000}
footer{text-align:center;color:var(--lmut);font-size:12px;padding:10px 0 30px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60}#toast.on{opacity:1}
.socs{display:flex;gap:18px;flex-wrap:wrap}.s{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-decoration:none;cursor:pointer}
.s svg{box-sizing:content-box;padding:15px;border-radius:50%;background:#000;border:1px solid #333}.s em{font-style:normal;font-size:11px;color:var(--lmut)}
.s.facebook svg{background:#1877f2;border-color:#1877f2}.s.messenger svg{background:linear-gradient(135deg,#00b2ff,#a334fa 60%,#ff5c87);border-color:transparent}
.s.instagram svg{background:linear-gradient(45deg,#f9a63a,#e1306c 50%,#833ab4);border-color:transparent}.s.tiktok svg{background:#000;border-color:#25f4ee;box-shadow:2px 2px 0 #fe2c55}

#contact{max-width:none;color:#fff;background:radial-gradient(circle at 15% 10%,#c9a64e88,transparent 45%),radial-gradient(circle at 90% 70%,#6b4ea055,transparent 50%),#0a0a0a}
#contact>*{max-width:856px;margin-left:auto;margin-right:auto}#contact .lab,#contact .s em{color:#c8c8c8}
.card{background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 32px #0006,inset 0 1px 0 rgba(255,255,255,.35)}
.row{border-color:rgba(255,255,255,.18)!important}
.qa a,.qa button,.qa .pri,.pill,.dock a,.dock a:first-child,.s svg{background:rgba(255,255,255,.12)!important;color:#fff!important;border:1px solid rgba(255,255,255,.32)!important;backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px #0004}
.qa .pri,.pill.w,.dock a:first-child{background:rgba(255,255,255,.28)!important}
.s.facebook svg{background:rgba(24,119,242,.55)!important}.s.messenger svg{background:linear-gradient(135deg,#00b2ffaa,#a334faaa 60%,#ff5c87aa)!important}
.s.instagram svg{background:linear-gradient(45deg,#f9a63aaa,#e1306caa 50%,#833ab4aa)!important}.s.tiktok svg{background:rgba(0,0,0,.45)!important}
.dock{background:rgba(20,20,20,.35)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2)}

html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}img,svg{max-width:100%}
#follow{max-width:none;color:#fff;background:radial-gradient(circle at 85% 15%,#c9a64e77,transparent 45%),radial-gradient(circle at 10% 90%,#6b4ea055,transparent 50%),#0a0a0a}
#follow>*{max-width:856px;margin-left:auto;margin-right:auto}#follow .lab,#follow .s em{color:#c8c8c8}#follow h2{margin-bottom:26px}.socs{justify-content:center}
@media(min-width:700px){.hero,.dark .in{padding-left:max(22px,calc((100vw - 1000px)/2));padding-right:max(22px,calc((100vw - 1000px)/2))}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.accs .ac{margin:0}
.sl{overflow:visible}.sl figure{flex:1;max-width:none}.info{max-width:640px}.hero p{font-size:16px}}
@media(min-width:900px){section{max-width:1000px}#mb{display:none}
#menu{position:fixed;inset:auto;top:0;right:max(22px,calc((100vw - 1000px)/2));left:auto;bottom:auto;display:flex;flex-direction:row;gap:28px;background:none;padding:calc(18px + env(safe-area-inset-top,0px)) 0 0;z-index:25}
#menu a{font-size:13px;font-weight:600;letter-spacing:1px;padding:0}header{padding-left:max(22px,calc((100vw - 1000px)/2))}
.dock{max-width:420px}}
@media(max-width:360px){section{padding:56px 16px}.info{grid-template-columns:1fr 1fr}.pill{padding:12px 16px;font-size:13px}.qa{grid-template-columns:repeat(2,1fr)}}
@media(max-height:480px) and (orientation:landscape){.hero{min-height:auto;padding-top:90px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;scroll-behavior:auto!important}}
.hb{display:flex;align-items:center;gap:10px}.hb img{width:38px;height:38px;border-radius:50%}.hl{width:96px;height:96px;border-radius:50%;margin-bottom:18px;box-shadow:0 0 0 2px var(--gold)}</style></head><body>

messenger:'<path d="M12 2C6.5 2 2 6.2 2 11.5c0 2.9 1.3 5.4 3.4 7.1V22l3.1-1.7c1 .3 2.4.5 3.5.5 5.5 0 10-4.2 10-9.5S17.5 2 12 2zm1 12.8l-2.5-2.7-4.9 2.7 5.4-5.7 2.6 2.7 4.8-2.7-5.4 5.7z"/>',
instagram:'<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2"/>',
tiktok:'<path d="M16 3c.3 2.4 1.7 3.9 4 4.1v3.1c-1.5 0-2.8-.4-4-1.2v6.2c0 3.1-2.4 5.3-5.3 5.3S5.4 18.3 5.4 15.3c0-3.3 2.8-5.5 6-5.1v3.2c-1.5-.4-2.8.5-2.8 1.9 0 1.1.9 2 2 2 1.3 0 2.1-.9 2.1-2.3V3z"/>'};
const BL=k=>esc(C.buttonLabels[k]||k);
const qa=k=>k==="save"?`<button class="pri" id="save"><span>${ICON.save}</span>${BL(k)}</button>`:`<a class="${k==="call"?"pri":""}" data-k="${k}"><span>${ICON[k]||""}</span>${BL(k)}</a>`;
const soc=k=>`<a class="s ${k}" data-k="${k}" aria-label="${BL(k)}"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">${SVG[k]||""}</svg><em>${BL(k)}</em></a>`;
const lab=(l,t)=>`<div class="lab">${T(l)}</div>`;
const H=C.hero,K=C.contact,A=C.about,S=C.services,G=C.gallery,F=C.follow;
const rows=[[K.phoneLabel,C.phone],C.email&&[K.emailLabel,C.email],C.address&&[K.addressLabel,C.address],[K.servicesLabel,C.specialties]].filter(Boolean).map(r=>`<div class="row"><small>${T(r[0])}</small>${T(r[1])}</div>`).join("");
const gal=G.items.map((g,i)=>`<figure><img src="${esc(g.image||IMG.gallery[i]||"")}" alt="${T(g.caption)}"><figcaption>${T(g.caption)}</figcaption></figure>`).join("");
$("#app").innerHTML=`
<div class="hero" id="home"><img id="heroLogo" class="hl" alt="">${lab(H.eyebrow).replace("lab","eye")}
<h1>${T(H.titleMain)}<span>${T(H.titleSub)}</span></h1><p>${T(H.text)}</p>
<div class="btns"><a class="pill w" data-k="call">📞 ${T(H.primaryButton)}</a><a class="pill o" data-k="${esc(H.secondaryButtonLink)}">${T(H.secondaryButton)}</a></div>
<div class="info">${H.facts.map(f=>`<div><small>${T(f.label)}</small><b>${T(f.value)}</b></div>`).join("")}</div></div>
<section id="contact">${lab(K.label)}<h2>${T(K.title)}</h2><div class="card"><h3>${T(K.cardTitle)}</h3>${rows}<div class="qa">${K.buttons.map(qa).join("")}</div></div></section>
<section id="about">${lab(A.label)}<h2>${T(A.title)}</h2><p class="lead">${T(A.text)}</p><div class="num">${A.stats.map(s=>`<div>${T(s.number)}<small>${T(s.label)}</small></div>`).join("")}</div></section>
<section id="services" style="padding-top:0">${lab(S.label)}<h2>${T(S.title)}</h2><p class="lead" style="margin-bottom:22px">${T(S.hint)}</p><div class="accs">${S.items.map((s,i)=>`<div class="ac"><button class="ah"><i>${String(i+1).padStart(2,"0")}</i><b>${T(s.name)}</b><u>+</u></button><p>${T(s.desc)}</p></div>`).join("")}</div></section>
<section class="dark" id="results"><div class="in">${lab(G.label)}<h2>${T(G.title)}</h2><p class="lead">${T(G.hint)}</p><div class="sl">${gal}</div></div></section>
<section id="follow">${lab(F.label)}<h2>${T(F.title)}</h2><div class="socs">${F.buttons.map(soc).join("")}</div></section>
<footer>${T(C.footerText)}</footer>`;
$("#menu").innerHTML=C.menu.map(m=>`<a href="#${esc(m.target)}">${T(m.label)}</a>`).join("");
$("#brand").textContent=C.businessName.toUpperCase();
$("#dock").innerHTML=C.dock.map((k,i)=>`<a data-k="${k}">${i===0&&k==="call"?"📞 "+BL("dockCall"):BL(k)}</a>`).join("");
$("#splashImg").src=logo;$("#hLogo").src=logo;const hl=$("#heroLogo");if(hl)hl.src=logo;if(!C.showSplash)$("#splash").remove();
const t=$("#toast");let tm;const toast=m=>{t.textContent=m;t.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("on"),2200)};
document.querySelectorAll("[data-k]").forEach(a=>{const u=LINKS[a.dataset.k];
 if(u){a.href=u;if(/^http/.test(u)){a.target="_blank";a.rel="noopener"}}
 else if(C.hideEmptyButtons)a.remove();else a.addEventListener("click",e=>{e.preventDefault();toast("This link isn't set up yet")})});
const m=$("#menu");$("#mb").onclick=()=>m.classList.toggle("on");m.querySelectorAll("a").forEach(a=>a.onclick=()=>m.classList.remove("on"));
document.querySelectorAll(".ah").forEach(b=>b.onclick=()=>{const c=b.parentElement;c.classList.toggle("on");b.querySelector("u").textContent=c.classList.contains("on")?"−":"+"});
const vcf=()=>["BEGIN:VCARD","VERSION:3.0","FN:"+C.businessName,"ORG:"+C.fullName,"TEL;TYPE=CELL,VOICE:"+intl,C.email&&"EMAIL:"+C.email,C.address&&"ADR;TYPE=WORK:;;"+C.address+";;;;",C.website&&"URL:"+C.website,"END:VCARD"].filter(Boolean).join("\r\n");
const sv=$("#save");if(sv)sv.addEventListener("click",async()=>{
 try{const d=await claude.use("downloads");if(d){await d.save({filename:C.businessName.replace(/\W+/g,"-")+".vcf",data:vcf()});return}}catch(e){if(e&&e.code==="declined")return}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([vcf()],{type:"text/vcard"}));a.download=C.businessName.replace(/\W+/g,"-")+".vcf";document.body.appendChild(a);a.click();a.remove();toast("Contact file ready")}catch(e){toast("Saving isn't available here")}});
</script>
</body></html>
