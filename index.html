 const frame=now=>{raf=0;if(!vis||document.hidden)return;
  const t=(now-t0)/1000,e=Math.min(1,Math.max(0,(now-born)/1600)),ease=1-Math.pow(1-e,3),sy=Math.min(1,scrollY/innerHeight);
  tx+=(mx-tx)*.05;ty+=(my-ty)*.05;
  tg.rotation.set(ty*.22+.06,(rm?.6:t*.4)+tx*.6+sy*2.5,0);tg.position.y=rm?0:Math.sin(t*1.2)*.07;
  holo.rotation.set(ty*.1,tx*.25,0);
  const w=rm?.3:Math.sin(t*.7)*.5+.5;scan.position.y=-1.5+w*3.1;sring.material.opacity=.9*Math.sqrt(Math.sin(w*Math.PI));sdisc.material.opacity=.1*Math.sqrt(Math.sin(w*Math.PI));
  belt.position.y=-.2+(rm?0:Math.sin(t*.5)*.08);
  grid.material.opacity=.34+(1-ease)*.5;glow.material.opacity=.3+(rm?0:.05*Math.sin(t*1.5));pts.rotation.y=-t*.08;
  g.scale.setScalar(S*ease*(1-sy*.25));g.position.set(X,Y+sy*.8,0);
  rd.render(sc,cam);if(!rm)raf=requestAnimationFrame(frame)};
 const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
 const fit=()=>{const w=hero.clientWidth,h=hero.clientHeight;rd.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  const hh=2.58,hw=hh*w/h;lbl.forEach(s=>s.visible=w>=900);
  if(w>=900){S=.85;X=hw*.52;Y=0}else if(w>=700){S=.6;X=hw*.5;Y=.2}else{S=.4;X=hw*.3;Y=hh*.55}
  kick()};
 if(!rm)addEventListener("pointermove",e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1},{passive:true});
 new IntersectionObserver(([e])=>{vis=e.isIntersecting;if(vis)kick()}).observe(hero);
 document.addEventListener("visibilitychange",kick);
 new ResizeObserver(fit).observe(hero);fit();
}

function tilt(){
 if(!fine||rm)return;
 document.querySelectorAll(".card,.sl figure").forEach(el=>{
  el.addEventListener("pointermove",e=>{if(el.classList.contains("rvl"))return;
   const b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;
   el.style.transition="transform .12s linear";el.style.transform=`perspective(900px) rotateX(${(.5-y)*7}deg) rotateY(${(x-.5)*9}deg)`;
   el.style.setProperty("--gx",x*100+"%");el.style.setProperty("--gy",y*100+"%")});
  el.addEventListener("pointerleave",()=>{el.style.transition="transform .6s cubic-bezier(.2,.7,.2,1)";el.style.transform=""})})}

function flow(){
 if(rm)return;
 document.querySelectorAll(".sl").forEach(sl=>{let f=0;const upd=()=>{f=0;const it=[...sl.children].map(c=>c.firstElementChild).filter(Boolean);
  if(sl.scrollWidth<=sl.clientWidth+4){it.forEach(el=>el.style.transform="");return}
  const b=sl.getBoundingClientRect(),c=b.left+b.width/2;
  it.forEach(el=>{const r=el.getBoundingClientRect(),d=Math.max(-1,Math.min(1,(r.left+r.width/2-c)/b.width));
   el.style.transform=`perspective(800px) rotateY(${-d*22}deg) scale(${1-Math.abs(d)*.08})`})};
  sl.addEventListener("scroll",()=>{f||(f=requestAnimationFrame(upd))},{passive:true});addEventListener("resize",upd);upd()})}

addEventListener("DOMContentLoaded",()=>{tooth();tilt();flow()});
})();

/* ===== offers: tap a picture to view it full screen ===== */
(()=>{let lb;const open=src=>{if(!lb){lb=document.createElement("div");lb.id="lb";lb.setAttribute("role","dialog");lb.setAttribute("aria-label","Picture viewer");lb.innerHTML='<img alt=""><button aria-label="Close">\u2715</button>';document.body.appendChild(lb);lb.onclick=()=>close();}
 lb.querySelector("img").src=src;lb.classList.add("on");document.body.style.overflow="hidden"};
 const close=()=>{if(lb){lb.classList.remove("on");document.body.style.overflow=""}};
 document.addEventListener("click",e=>{const im=e.target.closest&&e.target.closest(".offers img");if(im)open(im.currentSrc||im.src)});
 document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});})();
</script>
